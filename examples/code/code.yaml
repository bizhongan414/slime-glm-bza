tool_names: [code_interpreter]
interaction_name: null
tool_parser_name: deepseek_dsml
chat_formatter_class: examples.code.tool_utils.deepseek_v32_formatter.DeepSeekV32Formatter

# for sandbox
sandbox_local_run: true
sandbox_default_time_limit_s: 10
sandbox_default_memory_limit_mb: 1024
sandbox_use_case_custom_time_limit: true
sandbox_use_case_custom_memory_limit: true

sandbox_url: http://222.223.106.147:20088/run_code_with_log

execution_num_workers: 64
use_local_sandbox: false

# for rollout
code_rollout_max_turn: 3
code_feedback_message_filepath: examples/code/deps/multi_turn_feedback.yaml # 默认 examples/code/deps/multi_turn_feedback.yaml
code_feedback_message_version: v0

# reward
code_use_format_reward: False
code_use_timeout_reward: False

# override
reward_key: score
eval_reward_key: score
